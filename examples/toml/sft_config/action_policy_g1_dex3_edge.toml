# Cosmos3-Edge WAM policy SFT for 30 Hz Unitree G1 + dual Dex3 demonstrations.
# Dataset composition and action semantics live in the registered experiment.

[job]
task       = "vfm"
experiment = "action_policy_g1_dex3_edge"
project    = "cosmos3_action"
group      = "g1_dex3_action_sft"
name       = "Cosmos3-Edge-Policy-G1"
wandb_mode = "disabled"

[model]
precision = "bfloat16"

[model.ema]
enabled = false

[model.parallelism]
data_parallel_shard_degree     = -1
data_parallel_replicate_degree = 1
fsdp_master_dtype              = "bfloat16"
fsdp_reduce_dtype              = "bfloat16"

[model.activation_checkpointing]
mode           = "full"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 2.0e-4

[scheduler]
cycle_lengths = [100000]

[dataloader_train]
max_samples_per_batch = 1

[trainer]
max_iter        = 10000
logging_iter    = 10
grad_accum_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 1000
